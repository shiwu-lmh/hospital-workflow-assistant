<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>流程助手 · 置顶悬浮窗控制页</title><link rel="stylesheet" href="floating.css"></head>
<body>
  <main><h1>院内流程助手 · 置顶悬浮窗</h1>
  <p>开启后先显示置顶悬浮球，点击球展开任务面板，点击面板“收起”恢复为球。刷新业务网页也不会关闭它。</p>
  <button id="start">开启置顶悬浮球</button>
  <button id="workbench">完整工作台</button>
  <p id="notice" role="status">请保留这个控制标签页，关闭它会同时关闭悬浮窗。</p></main>
